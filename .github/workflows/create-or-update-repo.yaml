name: Create or Update Repo

on:
    workflow_dispatch:
        inputs:
            repo_name:
                description: Name of the repo to create
                required: true
                type: string
            is_public_repo:
                description: If unchecked, repo is public.
                required: true
                default: true
                type: boolean
            repo_description:
                description: Description of the repo to create
                required: false
                type: string
            author_name:
                description: Name of the author to use in the generated project
                required: false
                type: string

env:
    GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

jobs:
    create-repo-if-not-exists:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Configure git user
              run: |
                  git config --global user.email "7979807+ArunSubramanian456@users.noreply.github.com"
                  git config --global user.name "Arun Subramanian"

            - name: Create repo if not exists
              run: |
                  bash -x run.sh create-repo-if-not-exists
              env:
                  GITHUB_REPO_NAME: ${{ github.event.inputs.repo_name }}
                  GITHUB_USERNAME: ${{ github.repository_owner }}
                  IS_PUBLIC_REPO: ${{ github.event.inputs.is_public_repo }}

    configure-repo:
        needs: [create-repo-if-not-exists]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Configure git user
              run: |
                  git config --global user.email "test@test.com"
                  git config --global user.name "Eric Riddoch"
            - run: |
                  bash -x run.sh configure-repo
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
                  GITHUB_REPO_NAME: ${{ github.event.inputs.repo_name }}
                  GITHUB_USERNAME: ${{ github.repository_owner }}

    open_pr_with_generated_project:
        needs: [create-repo-if-not-exists]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Configure git user
              run: |
                  git config --global user.email "test@test.com"
                  git config --global user.name "Eric Riddoch"
            - run: |
                  bash -x run.sh open-pr-with-generated-project
              env:
                  GITHUB_REPO_NAME: ${{ github.event.inputs.repo_name }}
                  GITHUB_REPO_DESCRIPTION: ${{ github.event.inputs.repo_description }}
                  USER_FULLNAME: ${{ github.event.inputs.author_name }}
                  GITHUB_USERNAME: ${{ github.repository_owner }}
